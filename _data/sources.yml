# The event sources: slug is the URL parameter, value is what the ingest
# sync stamps into each event's private "source" property (empty for
# community submissions), and color identifies the source in the calendar
# view (always with the title alongside — color never carries the identity
# alone). The values must stay in step with the source list in the
# needham-circle/ingest repo.
