name: Sync events

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  # Emit the list of sources so the matrix stays driven by the registered
  # fetchers (`rake sync:list`) rather than a second copy of the names here.
  discover:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.list.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - id: list
        # tail -n1: sync:list prints the JSON array last, so any load-time
        # stdout noise can't corrupt the value the matrix parses via fromJson.
        run: echo "sources=$(bundle exec rake sync:list | tail -n1)" >> "$GITHUB_OUTPUT"

  sync:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Each source is independent; one failing feed shouldn't stop the others
      # from syncing. Failures still surface per-source in the matrix.
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.discover.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake sync:${{ matrix.source }}
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
          EVENTS_CALENDAR_ID: ${{ secrets.EVENTS_CALENDAR_ID }}
